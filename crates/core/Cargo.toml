[package]
name = "crawler-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["gzip", "cookies"] }
scraper = "0.21"
epub-builder = "0.7"
async-trait = "0.1"
anyhow = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
